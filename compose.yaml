services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pr_atlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pr_atlas_pw
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr_atlas"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://postgres:pr_atlas_pw@postgres:5432/pr_atlas
      PR_ATLAS_ARTIFACT_ROOT: /atlas
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - atlas-artifacts:/atlas
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  atlas-artifacts:
